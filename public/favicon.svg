<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0a0b12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Core Beam -->
    <linearGradient id="coreBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGlow)" stroke="url(#neonGlow)" stroke-width="2.5" />

  <!-- Inner Soft Aura Ring -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.35" />

  <!-- Glow effect of the Z -->
  <path
    d="M 36 38 L 92 38 L 44 90 L 92 90"
    fill="none"
    stroke="url(#neonGlow)"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#bloom)"
    opacity="0.6"
  />

  <!-- Sharp Main Geometric "Z" -->
  <path
    d="M 36 38 L 92 38 L 44 90 L 92 90"
    fill="none"
    stroke="url(#coreBeam)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Twin Digital Nodes (Circuit Points) -->
  <circle cx="58" cy="46" r="3.5" fill="#38bdf8" filter="url(#bloom)" />
  <circle cx="70" cy="82" r="3.5" fill="#c084fc" filter="url(#bloom)" />

  <!-- Center AI Sparkle Star -->
  <g transform="translate(68, 64)">
    <path
      d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z"
      fill="#ffffff"
      filter="url(#bloom)"
    />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
  </g>
</svg>
